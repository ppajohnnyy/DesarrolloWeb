<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <title>TechStore</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <!-- Pantalla principal -->
        <section id="home" class="screen active">

            <header class="top-bar">
                <h1>TechStore</h1>
                <button class="notification-btn">♡</button>
            </header>

            <div class="content">

                <section class="welcome">
                    <p class="location">📍 CHILE</p>


                    <div class="contenedor">
                        <img src="fondo.jpg" class="fondo-01" alt="foto de fondo">
                        <div class="texto-encima">TechStore</div>
                    </div>

                    <h2>Tu tienda de tecnología</h2>
                    <p>
                        Encuentra los últimos productos tecnológicos
                        y accesorios.
                    </p>

                    <!-- Reemplaza el botón anterior por este enlace -->
                    <a href="productos.html" class="primary-btn">
                        Comenzar a explorar →
                    </a>
                </section>

            </div>

        </section>


        <!-- Pantalla de productos -->
        <section id="products" class="screen">

            <header class="top-bar">
                <h1>Productos</h1>
            </header>

            <div class="content">

                <h2>Tecnología Premium</h2>

                <div class="product-card">
                    <div class="product-image"></div>

                    <div class="product-info">
                        <h3>iPhone 17 Pro</h3>
                        <p>El nuevo iPhone</p>
                        <strong>$1.099.990</strong>
                    </div>

                    <button>Agregar al carrito</button>
                </div>

            </div>

        </section>


        <!-- Carrito -->
        <section id="cart" class="screen">

            <header class="top-bar">
                <h1>Carrito</h1>
            </header>

            <div class="content">
                <h2>Resumen de compra</h2>

                <div id="cart-items"></div>

                <div class="cart-total">
                    <span>Total</span>
                    <strong>$0</strong>
                </div>

                <button class="primary-btn">
                    Pagar ahora
                </button>
            </div>

        </section>


        <!-- Barra de navegación -->
        <nav class="bottom-nav">

            <button onclick="showScreen('home')">
                <span>⌂</span>
                Inicio
            </button>

            <button onclick="showScreen('products')">
                <span>⌕</span>
                Buscar
            </button>

            <button onclick="showScreen('cart')">
                <span>🛒</span>
                Carrito
            </button>

            <button>
                <span>♙</span>
                Perfil
            </button>

        </nav>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
